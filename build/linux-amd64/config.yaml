records:
  hws.unreal.local:
    ip: 172.31.255.80
    ttl: 3600
  euc.unreal.local:
    ip: 172.31.255.80
  hws.euc.unreal.local:
    ip: 172.31.255.80
  unreal.local:
    ip: 172.31.255.135
    ttl: 0 # TTL of 0 prevents caching and is respected. Default TTL is only used if 'ttl' key is omitted.
fallback_dns: 8.8.8.8
fallback_protocol: "udp"
default_ttl: 60 # does not pverrode fallback protocol ttl
server:
  udp:
    enabled: true
    port: 53
    interfaces: ["0.0.0.0"]
  tcp:
    enabled: true
    port: 53
    interfaces: ["0.0.0.0"]
    # interfaces: ["0.0.0.0", "127.0.0.1", "192.168.1.100"]
